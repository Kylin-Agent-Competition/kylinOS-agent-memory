name: Technical Debt
description: 记录技术债务
title: "[TD] "
labels: ["technical-debt"]
body:
  - type: textarea
    id: current_state
    attributes:
      label: 现状
      description: 当前的实现或设计是什么样的
    validations:
      required: true
  - type: textarea
    id: ideal_state
    attributes:
      label: 理想状态
      description: 正确的实现应该是什么样的
    validations:
      required: true
  - type: textarea
    id: temp_impl
    attributes:
      label: 临时实现
      description: 当前采用了什么临时方案
  - type: textarea
    id: reason
    attributes:
      label: 原因
      description: 为什么采用了临时实现
  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 此技术债对系统的影响
  - type: input
    id: owner
    attributes:
      label: 责任人
      placeholder: "@username"
  - type: input
    id: plan_date
    attributes:
      label: 计划解决日期
  - type: textarea
    id: close_evidence
    attributes:
      label: 关闭证据
      description: 什么可以证明此技术债已解决
