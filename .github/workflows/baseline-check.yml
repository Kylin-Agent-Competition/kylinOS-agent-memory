name: Repository Baseline Check

on:
  pull_request:
    branches: [main, integration]
  push:
    branches: [main, integration]

jobs:
  baseline-check:
    name: 仓库基线验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 脚本语法检查
        run: |
          for script in scripts/*.sh; do
            echo "检查: $script"
            bash -n "$script" || exit 1
          done

      - name: 仓库基线结构验证
        run: |
          chmod +x scripts/verify_repository_baseline.sh
          ./scripts/verify_repository_baseline.sh

      - name: M1-KB 冻结导入契约守卫
        run: python3 scripts/verify_main_to_data_kb_import_contract.py

      - name: D13E 正式评测契约测试
        run: |
          python3 -m unittest memory-service.tests.test_d13e_formal_eval -v

      - name: Install Memory Service L1 dependencies
        run: python3 -m pip install -r memory-service/requirements.txt

      - name: D13D prerequisite L1 regression
        env:
          PYTHONPATH: memory-service
        run: |
          python3 -m pytest \
            memory-service/tests/test_d13d_execution_adapter.py \
            memory-service/tests/test_d13d_phase3_prep.py \
            memory-service/tests/test_d13d_safety_observability.py \
            memory-service/tests/test_d13d_forget_observability.py \
            memory-service/tests/test_event_ingest_d6d.py \
            memory-service/tests/test_forget_persistence_d10d.py \
            memory-service/tests/retrieval/test_evaluation.py \
            -q
      - name: D14B preparation harness L1
        env:
          PYTHONPATH: memory-service
        run: |
          python3 -m pytest \
            tests/retrieval/test_d14b_harness.py \
            -q

  d14a-packaging-provenance:
    name: D14A packaging + provenance L1
    runs-on: ubuntu-latest
    # 2026-09-06 D14D 人工裁决 D-14：把 packaging 4 个 Python 测试与
    # docs/day14/test_d14a_release_provenance.py 加入 CI，使 head 漂移/包完整性
    # 问题在合并前自动失败（本地 WSL 实测 77 passed）。
    # 2026-09-07 M2-B：接入 docs/day15/test_d15a_rc_lock_matrix.py 发布锁矩阵守卫，
    # 不新增 job/runner，复用本 job，保持 fetch-depth: 0。
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # provenance live 门禁需要 tested_runtime_commit（e3d4b9d…）完整历史；
          # 默认 fetch-depth=1 会导致 git diff <tested>..HEAD 失败。
          fetch-depth: 0

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: D14A packaging + provenance L1 tests
        run: |
          python3 -m pytest -q \
            packaging/release/test_d14a_package_integrity.py \
            packaging/release/test_d14a_relocatable_runtime.py \
            packaging/release/test_d14a_transactional_rollback.py \
            packaging/release/test_d14a_verify_smoke.py \
            docs/day14/test_d14a_release_provenance.py \
            docs/day15/test_d15a_rc_lock_matrix.py \
            docs/day15/test_d15b_btrack_finalization.py

  carlton-independent-host-evidence:
    name: Carlton independent host evidence closure
    runs-on: ubuntu-latest
    # 2026-09-06 Carlton 独立宿主证据包（ddd8d30 封存）已冻结；
    # test_package_closure.py 为 VERIFY_ONLY 只读校验，任何篡改/漂移在
    # 合并前自动失败。SOURCE_EVIDENCE_ROOT 为可选 /mnt/c/... 源路径，
    # ubuntu runner 上不存在时走 MISSING_SOURCE_TEST=PASS，无需 workaround。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Carlton independent host evidence closure verify
        run: |
          python3 -m pytest evidence/host-validation/kylin-v11-sdk-identity-carlton-20260906/test_package_closure.py -q
