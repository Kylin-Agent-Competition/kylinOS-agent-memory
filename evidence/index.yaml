index_contract:
  # 字段语义（MEDIUM-07 明确，2026-08-14）：
  # - tested_commit: 被实际执行 Runtime 测试的生产代码 commit
  # - evidence_commit: 最终证据文件正式提交进仓库的 commit（≠ tested_commit；
  #   证据文件在后续 docs/evidence commit 才回填仓库时，两者不同）
  # - commit: 历史兼容字段（旧条目 = tested_commit）
  required_fields:
    - id
    - task_id
    - description
    - status
    - evidence_level
    - source
    - date
    - reviewer
    - limitations
    - checksum_sha256
  optional_fields:
    - commit
    - source_commit
    - report
    - runtime_result
    - details
    - tested_commit
    - evidence_commit
    - sdk_source_commit
    - probe_source_sha256
    - cleanup_manifest_header_sha256
    - probe_binary_sha256
    - runner_source_sha256
    - manifest_sha256
    - review_status
    - merge_qualified
