# Alembic 配置（D4D，ADR-007：基线 001_initial_schema.py + 后续 YYYYMMDD_<desc>.py）
# 数据库 URL 由 migrations/env.py 从应用配置读取（database.path），此处不写死。

[alembic]
script_location = migrations
# sqlalchemy.url 由 env.py 动态注入（KYLIN_MEMORY_DB / ~/.local/share/kylin-memory/kylin_memory.db）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
